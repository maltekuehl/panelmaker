services:
  postgres:
    image: postgres:16-alpine
    container_name: panelmaker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-panelmaker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-panelmaker}
      POSTGRES_DB: ${POSTGRES_DB:-panelmaker}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-panelmaker} -d ${POSTGRES_DB:-panelmaker}"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: panelmaker-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Shared uploads volume: the app (UPLOADS_DIR=./data/uploads) writes here, nginx serves it read-only.
      - ./data/uploads:/srv/uploads:ro
      # When the app is containerized, switch the line above to the named volume below
      # (also mount `uploads_data:/app/data/uploads` on the app service) and enable the
      # commented reverse-proxy block in docker/nginx/nginx.conf.
      # - uploads_data:/srv/uploads:ro

volumes:
  postgres_data:
  # uploads_data:
