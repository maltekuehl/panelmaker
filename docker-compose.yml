# Production stack: Postgres + one-shot migrations + the standalone Next.js
# app, all behind an nginx reverse proxy. nginx terminates client traffic,
# serves uploaded images straight off the shared volume, and forwards
# everything else to the app. Bring it up with:
#   docker compose up -d --build
#
# Runtime secrets come from .env (DATABASE_URL there is overridden below to
# point at the bundled Postgres service). NEXT_PUBLIC_* values are baked at
# build time, so set NEXT_PUBLIC_BASE_URL before building if it differs.

services:
  postgres:
    image: postgres:16-alpine
    container_name: panelmaker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-panelmaker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-panelmaker}
      POSTGRES_DB: ${POSTGRES_DB:-panelmaker}
    # Not published to the host by default: only reachable on the compose
    # network. Uncomment to expose for debugging.
    # ports:
    #   - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-panelmaker} -d ${POSTGRES_DB:-panelmaker}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      target: migrator
    image: panelmaker-migrate
    container_name: panelmaker-migrate
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-panelmaker}:${POSTGRES_PASSWORD:-panelmaker}@postgres:5432/${POSTGRES_DB:-panelmaker}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:8080}
    image: panelmaker-app
    container_name: panelmaker-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-panelmaker}:${POSTGRES_PASSWORD:-panelmaker}@postgres:5432/${POSTGRES_DB:-panelmaker}?schema=public
      UPLOADS_DIR: /app/data/uploads
    expose:
      - "3000"
    volumes:
      - uploads_data:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:alpine
    container_name: panelmaker-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    environment:
      # Credentials for the site-wide HTTP basic auth gate. Override in .env;
      # the .htpasswd file is regenerated from these on every container start.
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-panelmaker}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-panelmaker}
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Generates /etc/nginx/.htpasswd from the BASIC_AUTH_* env vars at startup.
      - ./docker/nginx/docker-entrypoint.d/40-basic-auth.sh:/docker-entrypoint.d/40-basic-auth.sh:ro
      # nginx serves uploads read-only straight from the shared app volume.
      - uploads_data:/srv/uploads:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
