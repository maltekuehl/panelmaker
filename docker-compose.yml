# Production stack: Postgres + a one-shot migrate service + the standalone
# Next.js app, all behind a Caddy reverse proxy. Caddy terminates client
# traffic (HTTPS with automatic certificates when SITE_ADDRESS is a hostname)
# and forwards everything to the app, including /uploads/, which the app
# serves itself so it can apply experiment visibility. Bring it up with:
#   docker compose up -d --build
#
# The migrate service runs `prisma migrate deploy` and then `npm run setup`
# (reference data, upserts only) on every `up`. Create the first admin once:
#   docker compose run --rm migrate npm run admin:create -- --email you@example.edu --name "Your Name"
# The generated password is printed once to the terminal and never stored.
#
# Operator overrides for legal pages and instance texts live in ./config,
# mounted read-only into the app at /app/config.
#
# Runtime secrets come from .env (DATABASE_URL there is overridden below to
# point at the bundled Postgres service). NEXT_PUBLIC_* values are baked at
# build time, so set NEXT_PUBLIC_BASE_URL before building if it differs.

services:
  postgres:
    image: postgres:16-alpine
    container_name: panelmaker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-panelmaker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-panelmaker}
    # Never published to the host and only attached to the internal
    # `database` network, so only the migrate and app services can reach it.
    networks:
      - database
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-panelmaker} -d ${POSTGRES_DB:-panelmaker}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      target: migrator
    image: panelmaker-migrate
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-panelmaker}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-panelmaker}?schema=public
    networks:
      - database
      - web
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:8080}
    image: panelmaker-app
    container_name: panelmaker-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-panelmaker}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-panelmaker}?schema=public
      UPLOADS_DIR: /app/data/uploads
      INSTANCE_CONFIG_DIR: /app/config
      # Auth.js runs behind Caddy, so it cannot infer its own origin from the request.
      AUTH_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:8080}/auth
      AUTH_TRUST_HOST: "true"
    expose:
      - "3000"
    networks:
      - database
      - web
    volumes:
      - uploads_data:/app/data/uploads
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    container_name: panelmaker-caddy
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/caddy/entrypoint.sh"]
    # The only published ports. On a server with its own domain, set
    # SITE_ADDRESS to the hostname and HTTP_PORT=80, HTTPS_PORT=443 so Caddy
    # can obtain a certificate. Behind another TLS proxy on the same host,
    # keep SITE_ADDRESS=:80 and set PROXY_BIND=127.0.0.1.
    ports:
      - "${PROXY_BIND:-0.0.0.0}:${HTTP_PORT:-8080}:80"
      - "${PROXY_BIND:-0.0.0.0}:${HTTPS_PORT:-8443}:443"
      - "${PROXY_BIND:-0.0.0.0}:${HTTPS_PORT:-8443}:443/udp"
    networks:
      - web
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-}
      # Optional site-wide HTTP basic auth gate. Off unless both are set;
      # regenerated on every container start. Setting only one refuses to start.
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docker/caddy/entrypoint.sh:/etc/caddy/entrypoint.sh:ro
      # Certificates and ACME account. Keep it, or restarts request new
      # certificates and run into Let's Encrypt rate limits.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

networks:
  database:
    internal: true
  web:

volumes:
  postgres_data:
  uploads_data:
  caddy_data:
  caddy_config:
