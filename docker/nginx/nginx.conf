# WebSocket upgrade helper: maps to "upgrade" when present, else "close".
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream app {
    server app:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Uploaded validation images are large lossless WebP files.
    client_max_body_size 100M;

    # Gate the whole site behind HTTP basic auth. The .htpasswd file is
    # generated at container start from BASIC_AUTH_USER / BASIC_AUTH_PASSWORD
    # (see docker/nginx/docker-entrypoint.d/40-basic-auth.sh). Locations
    # inherit this unless they override it with `auth_basic off`.
    auth_basic "PanelMaker";
    auth_basic_user_file /etc/nginx/.htpasswd;

    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml font/woff2;

    # Uploaded validation images are NOT served from disk here. Report images can belong to
    # PRIVATE or LAB experiments, and only the app knows who may see them, so /uploads/ goes
    # through the app route (app/uploads/[...path]/route.ts) which resolves the owning
    # experiment and applies the visibility check. The files themselves live on the shared
    # volume mounted into the app container.
    location /uploads/ {
        proxy_pass http://app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Allow unauthenticated health checks (used by external monitors).
    location = /api/health {
        auth_basic off;
        proxy_pass http://app;
        proxy_set_header Host $host;
        access_log off;
    }

    # Long-cache Next.js immutable build assets.
    location /_next/static/ {
        proxy_pass http://app;
        proxy_set_header Host $host;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Forward everything else to the Next.js app.
    location / {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
