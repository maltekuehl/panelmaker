# Future: reverse-proxy the Next.js app once it is containerized.
# upstream app {
#     server app:3000;
# }

server {
    listen 80;
    server_name _;

    # Uploaded validation images are large lossless WebP files; raise the body
    # limit for when this server also proxies uploads to the app.
    client_max_body_size 100M;

    # Serve uploaded validation images directly from the shared volume.
    location /uploads/ {
        alias /srv/uploads/;
        autoindex off;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Future: forward everything else to the Next.js app.
    # location / {
    #     proxy_pass http://app;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
